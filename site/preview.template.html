<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · 文件预览</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; color: #1e293b; background: #f6f7f9; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1120px; margin: 48px auto; padding: 0 24px; }
    a { color: #245bd0; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .back { font-size: 14px; }
    h1 { font-size: clamp(22px, 4vw, 32px); letter-spacing: -.025em; overflow-wrap: anywhere; margin: 24px 0 10px; }
    .metadata { color: #64748b; font-size: 14px; margin-bottom: 24px; }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 14px 16px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px 10px 0 0; }
    button, .download { border: 1px solid #d8e0eb; border-radius: 6px; padding: 8px 12px; background: #fff; color: inherit; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
    button:hover, .download:hover { background: #f0f4fa; text-decoration: none; }
    button:disabled { opacity: .5; cursor: default; }
    .download { color: #245bd0; margin-left: auto; }
    :focus-visible { outline: 2px solid #245bd0; outline-offset: 3px; }
    .code-view { margin: 0; padding: 16px 0; overflow: auto; max-height: 72vh; border: 1px solid #e2e8f0; border-top: 0; border-radius: 0 0 10px 10px; background: #fff; font: 13px/1.7 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; tab-size: 4; }
    .code-line { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); min-width: max-content; min-height: 1.7em; }
    .code-line:target { background: #fff2bf; }
    .line-number { position: sticky; left: 0; padding-right: 18px; text-align: right; color: #7b8799; background: #fff; user-select: none; }
    .code-line:target .line-number { background: #fff2bf; }
    .line-content { padding-right: 20px; white-space: pre; }
    .syntax-token { color: var(--shiki-light, inherit); font-style: var(--shiki-light-font-style, normal); font-weight: var(--shiki-light-font-weight, inherit); text-decoration: var(--shiki-light-text-decoration, none); }
    @media (prefers-color-scheme: dark) { .syntax-token { color: var(--shiki-dark, inherit); font-style: var(--shiki-dark-font-style, normal); font-weight: var(--shiki-dark-font-weight, inherit); text-decoration: var(--shiki-dark-text-decoration, none); } }
    .is-wrapped .code-line { min-width: 0; }
    .is-wrapped .line-content { white-space: pre-wrap; overflow-wrap: anywhere; }
    .status { min-height: 1.5em; color: #64748b; font-size: 14px; }
    .hint { color: #64748b; font-size: 13px; line-height: 1.7; }
    @media (max-width: 540px) { main { margin-top: 24px; padding: 0 12px; } .toolbar { gap: 8px; padding: 12px; } .code-line { grid-template-columns: 3.5rem minmax(0, 1fr); } .line-number { padding-right: 12px; } }
    @media (prefers-color-scheme: dark) { :root { color: #e2e8f0; background: #10151e; } .toolbar, .code-view, .line-number, button, .download { background: #171f2b; border-color: #2b3545; } a, .download { color: #8ab4ff; } .metadata, .status, .hint { color: #a3afc2; } button:hover, .download:hover { background: #253247; } .code-line:target, .code-line:target .line-number { background: #473d1d; } }
  </style>
  <script src="/site-assets/preview.js" defer></script>
</head>
<body>
  <main>
    <a class="back" href="/">← 返回文件列表</a>
    <h1>{{NAME}}</h1>
    <p class="metadata">{{LANGUAGE}} · {{SIZE}} B · {{LINE_COUNT}} 行</p>
    <div class="toolbar" aria-label="预览工具">
      <button id="copy-source" type="button">复制全文</button>
      <button id="toggle-wrap" type="button" aria-pressed="false" aria-controls="code-view">自动换行</button>
      <a class="download" href="{{DOWNLOAD_URL}}" download>下载原文件</a>
    </div>
    <pre class="code-view" id="code-view"><code>{{LINES}}</code></pre>
    <p class="status" id="preview-status" role="status" aria-live="polite"></p>
    <p class="hint">点击行号可定位并分享该行。预览按文本显示文件内容，原文件可随时下载。</p>
  </main>
</body>
</html>
